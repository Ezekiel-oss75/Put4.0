<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Путь 16 · Тест 1</title>
<style>
body{background:#05040f;color:#f0f0f7;font-family:-apple-system,sans-serif;margin:0;padding:20px;min-height:100vh}
h1{font-size:24px;margin-bottom:16px;color:#4facfe}
.btn{display:block;width:100%;padding:14px;background:linear-gradient(135deg,#4facfe,#b06bff);color:#fff;border:none;border-radius:14px;font-size:14px;font-weight:800;margin-bottom:8px}
.panel{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px;margin-bottom:12px}
.ok{color:#4cd964;font-weight:800}
.err{color:#ff3b5c;font-weight:800}
#status{font-size:13px;line-height:1.6;margin-top:16px}
</style>
</head>
<body>

<h1>🧘 Путь 16 · Тест 1</h1>

<div class="panel">
  <div style="font-size:14px;font-weight:800;margin-bottom:12px">Нажми кнопки по очереди:</div>
  <button class="btn" onclick="testJS()">1️⃣ Проверка JS</button>
  <button class="btn" onclick="testSave()">2️⃣ Проверка сохранения</button>
  <button class="btn" onclick="testShow()">3️⃣ Показать приложение</button>
</div>

<div class="panel" id="appPanel" style="display:none">
  <div style="font-size:16px;font-weight:900;margin-bottom:8px">✅ Приложение работает!</div>
  <div style="font-size:13px;color:#a8a8bd">Если ты это видишь — база в порядке, можно добавлять вкладки.</div>
</div>

<div id="status"></div>

<script>
'use strict';

const status = document.getElementById('status');
function log(msg, cls) {
  const d = document.createElement('div');
  d.className = cls || '';
  d.textContent = msg;
  status.appendChild(d);
}

window.addEventListener('error', function(e) {
  log('❌ ОШИБКА: ' + e.message, 'err');
});

function testJS() {
  try {
    const n = 5 + 3;
    if (n === 8) log('✅ JavaScript работает', 'ok');
    else log('❌ JS сломан', 'err');
  } catch (e) {
    log('❌ Ошибка JS: ' + e.message, 'err');
  }
}

function testSave() {
  try {
    localStorage.setItem('test_key', 'test_value');
    const v = localStorage.getItem('test_key');
    localStorage.removeItem('test_key');
    if (v === 'test_value') log('✅ localStorage работает', 'ok');
    else log('❌ localStorage не сохраняет', 'err');
  } catch (e) {
    log('❌ localStorage ошибка: ' + e.message, 'err');
  }
}

function testShow() {
  document.getElementById('appPanel').style.display = 'block';
  log('✅ Приложение показано', 'ok');
}
</script>

</body>
</html>
