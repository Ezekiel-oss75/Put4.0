<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Путь · Диагностика</title>
<style>
body{margin:0;min-height:100vh;background:#05040f;color:#f5f1ff;font-family:-apple-system,monospace;padding:16px;font-size:13px;line-height:1.7}
h1{font-size:20px;color:#8b7cff;margin-bottom:16px}
.ok{color:#4cd964}
.err{color:#f5576c}
.warn{color:#ffd166}
pre{background:rgba(255,255,255,0.05);padding:14px;border-radius:10px;overflow-x:auto;font-size:12px;white-space:pre-wrap;word-break:break-word;margin-bottom:12px}
.box{padding:12px;border-radius:10px;margin-bottom:12px;background:rgba(255,255,255,0.04);border-left:4px solid #8b7cff}
.box.ok{border-left-color:#4cd964;background:rgba(76,217,100,0.08)}
.box.err{border-left-color:#f5576c;background:rgba(245,87,108,0.08)}
</style>
</head>
<body>

<h1>🔍 Диагностика Пути</h1>

<div class="box" id="step1">
<b>1. Загрузка data.js...</b>
<div id="s1">Ожидание...</div>
</div>

<div class="box" id="step2">
<b>2. Загрузка app.js...</b>
<div id="s2">Ожидание...</div>
</div>

<div class="box" id="step3">
<b>3. Проверка переменных</b>
<div id="s3">Ожидание...</div>
</div>

<div class="box" id="step4">
<b>4. Запуск приложения</b>
<div id="s4">Ожидание...</div>
</div>

<div class="box err" id="errbox" style="display:none">
<b>⚠️ Ошибка:</b>
<pre id="errmsg"></pre>
</div>

<script>
var log1 = document.getElementById('s1');
var log2 = document.getElementById('s2');
var log3 = document.getElementById('s3');
var log4 = document.getElementById('s4');
var errbox = document.getElementById('errbox');
var errmsg = document.getElementById('errmsg');

window.addEventListener('error', function(e){
  errbox.style.display = 'block';
  errmsg.textContent = (e.message || 'Unknown') + '\n\n' + (e.filename || '') + ':' + (e.lineno || '');
});

function setOk(el, txt){ el.className = 'ok'; el.textContent = txt; }
function setErr(el, txt){ el.className = 'err'; el.textContent = txt; }
function setWarn(el, txt){ el.className = 'warn'; el.textContent = txt; }
</script>

<script src="data.js" onerror="document.getElementById('errbox').style.display='block';document.getElementById('errmsg').textContent+='data.js не загрузился\n'"></script>

<script>
(function(){
  var log1 = document.getElementById('s1');
  try {
    if (typeof STORAGE === 'undefined') setErr(log1, '❌ STORAGE не определена — data.js пустой или сломан');
    else if (typeof BASE_PRACTICES === 'undefined') setErr(log1, '❌ BASE_PRACTICES не определена');
    else if (typeof QUOTES === 'undefined') setErr(log1, '❌ QUOTES не определены');
    else if (typeof PET_STAGES === 'undefined') setErr(log1, '❌ PET_STAGES не определены');
    else if (typeof BUILDINGS === 'undefined') setErr(log1, '❌ BUILDINGS не определены');
    else if (typeof CHEST_REWARDS === 'undefined') setErr(log1, '❌ CHEST_REWARDS не определены');
    else if (typeof HEALTH_BASE === 'undefined') setErr(log1, '❌ HEALTH_BASE не определена');
    else setOk(log1, '✅ data.js OK · STORAGE=' + STORAGE + ' · практик: ' + BASE_PRACTICES.length + ' · цитат: ' + QUOTES.length);
  } catch(e) {
    setErr(log1, '❌ Ошибка: ' + e.message);
  }
})();
</script>

<script src="app.js" onerror="document.getElementById('errbox').style.display='block';document.getElementById('errmsg').textContent+='app.js не загрузился\n'"></script>

<script>
(function(){
  var log2 = document.getElementById('s2');
  try {
    if (typeof state === 'undefined') setErr(log2, '❌ state не определена — app.js пустой или сломан');
    else if (typeof render === 'undefined') setErr(log2, '❌ render() не определена');
    else if (typeof completePractice === 'undefined') setErr(log2, '❌ completePractice не определена');
    else if (typeof openChest === 'undefined') setErr(log2, '❌ openChest не определена');
    else if (typeof saveUserPlan === 'undefined') setErr(log2, '❌ saveUserPlan не определена');
    else if (typeof startVoiceMeditation === 'undefined') setErr(log2, '❌ startVoiceMeditation не определена');
    else setOk(log2, '✅ app.js OK · xp=' + state.xp + ' · питомец ур. ' + state.petLevel);
  } catch(e) {
    setErr(log2, '❌ Ошибка: ' + e.message);
  }
})();
</script>

<script>
(function(){
  var log3 = document.getElementById('s3');
  try {
    var missing = [];
    // Проверяем есть ли все элементы, которые нужны render()
    var needed = ['avatar','levelBadge','rankTitle','xpFill','xpText','statStreak','statToday','statTotal','statRank',
      'cardContainer','quoteContainer','dnaWrap','petContainer','chestContainer','domainContainer','planContainer',
      'goalsContainer','goalForm','habitsContainer','bodyContainer','financeContainer','analyticsContainer',
      'pathContainer','practicesContainer','questsContainer','barriersContainer','moodContainer',
      'healthContainer','askesisActive','askesisAvailable','knowledgeContainer','chart','calendar','achGrid',
      'themePicker','fractalPicker','customList','detailXp','detailStreak','detailDone','detailAch',
      'detailBarriers','detailGoals','detailCards','detailChests','detailPet'];
    for (var i = 0; i < needed.length; i++) {
      if (!document.getElementById(needed[i])) missing.push(needed[i]);
    }
    if (missing.length > 0) {
      setErr(log3, '❌ Отсутствуют элементы: ' + missing.join(', '));
    } else {
      setOk(log3, '✅ Все ' + needed.length + ' элементов на месте');
    }
  } catch(e) {
    setErr(log3, '❌ Ошибка: ' + e.message);
  }
})();

setTimeout(function(){
  var log4 = document.getElementById('s4');
  try {
    // Пробуем вызвать render
    if (typeof render === 'function') {
      render();
      setOk(log4, '✅ render() выполнен успешно! Приложение должно работать.');
      // Показываем реальное приложение
      document.body.innerHTML = '<div id="app" style="padding:20px;color:#4cd964;font-size:18px;">✅ Приложение работает!<br><br>Значит нужно вернуть настоящий index.html — он был сломан в другом месте.<br><br>Скопируй мне, что показано выше (шаги 1-3), чтобы я знал состояние.</div>';
    } else {
      setErr(log4, '❌ render не функция');
    }
  } catch(e) {
    setErr(log4, '❌ render() упал: ' + e.message + '\n' + (e.stack || '').substring(0, 400));
    errbox.style.display = 'block';
    errmsg.textContent = 'render() упал:\n' + e.message + '\n\n' + (e.stack || '').substring(0, 500);
  }
}, 1500);
</script>

</body>
</html>
