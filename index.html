<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Путь 16</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #05040f;
  color: #f0f0f7;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  padding: 20px;
  min-height: 100vh;
  line-height: 1.5;
}
h1 { font-size: 24px; color: #4facfe; margin-bottom: 16px; }
.box {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
}
.btn {
  display: block;
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #4facfe, #b06bff);
  color: #fff;
  border: none;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 800;
  margin-bottom: 8px;
  cursor: pointer;
}
.ok { color: #4cd964; font-weight: 700; }
.err { color: #ff3b5c; font-weight: 700; }
#log { font-size: 13px; line-height: 1.7; margin-top: 12px; }
#log div { margin: 4px 0; }
</style>
</head>
<body>

<h1 id="title">Загрузка...</h1>

<div class="box">
  <button class="btn" onclick="test1()">Тест 1: JS работает?</button>
  <button class="btn" onclick="test2()">Тест 2: сохранение работает?</button>
  <button class="btn" onclick="test3()">Тест 3: показать контент</button>
</div>

<div class="box" id="content" style="display:none">
  <div style="font-size:16px;font-weight:900;color:#4cd964;margin-bottom:8px">✅ Контент показан!</div>
  <div style="font-size:13px;color:#a8a8bd">Если ты это видишь — база работает. Значит можно строить приложение.</div>
</div>

<div id="log"></div>

<script>
'use strict';

/* Логирование */
var logEl = document.getElementById('log');
function log(msg, cls) {
  var d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = msg;
  logEl.appendChild(d);
}

/* Ловим ошибки */
window.onerror = function(msg, url, line) {
  log('❌ Ошибка: ' + msg + ' (строка ' + line + ')', 'err');
};

/* Инициализация */
try {
  document.getElementById('title').textContent = '🧘 Путь 16';
  log('✅ Страница загружена', 'ok');
} catch (e) {
  log('❌ Ошибка инициализации: ' + e.message, 'err');
}

/* Тест 1 */
function test1() {
  try {
    var a = 2 + 2;
    if (a === 4) {
      log('✅ JavaScript работает', 'ok');
    } else {
      log('❌ JS вернул неправильно', 'err');
    }
  } catch (e) {
    log('❌ Ошибка теста 1: ' + e.message, 'err');
  }
}

/* Тест 2 */
function test2() {
  try {
    localStorage.setItem('put16_test', 'hello');
    var v = localStorage.getItem('put16_test');
    localStorage.removeItem('put16_test');
    if (v === 'hello') {
      log('✅ Сохранение работает', 'ok');
    } else {
      log('❌ Сохранение не сработало', 'err');
    }
  } catch (e) {
    log('❌ Ошибка сохранения: ' + e.message, 'err');
  }
}

/* Тест 3 */
function test3() {
  try {
    document.getElementById('content').style.display = 'block';
    log('✅ Контент показан', 'ok');
  } catch (e) {
    log('❌ Ошибка показа: ' + e.message, 'err');
  }
}

log('Готово. Нажимай кнопки по очереди.', '');
</script>

</body>
</html>
